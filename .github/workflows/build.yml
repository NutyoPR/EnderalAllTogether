name: Build EnderalAllTogether
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 6fdd23fa0a9479a9f9a1c48178696f60cf39255d
      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: clear
        run: >
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse vcpkg/buildtrees -Include *-out.log,*CMakeCache.txt.log -ErrorAction SilentlyContinue |
            ForEach-Object { "=== $($_.FullName)"; Get-Content $_ -Tail 30 }
      - name: Build
        run: cmake --build build
      - name: Stage
        run: |
          New-Item -ItemType Directory out -Force | Out-Null
          Copy-Item -Recurse mod/* out/
          New-Item -ItemType Directory out/SKSE/Plugins -Force | Out-Null
          Copy-Item build/EnderalAllTogether.dll out/SKSE/Plugins/
      - uses: actions/upload-artifact@v4
        with: { name: EnderalAllTogether, path: out }
      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath EnderalAllTogether-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: EnderalAllTogether-${{ github.ref_name }}.zip
